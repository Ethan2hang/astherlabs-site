<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Interface preview retired — SynthFlow</title>
  <style>
    :root { color-scheme: dark; --bg: #101125; --text: #faf5ed; --text-muted: #c7c0d3; --lavender: #c6b1fa; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.7 system-ui, sans-serif; }
    main { max-width: 680px; margin: 15vh auto; padding: 24px; }
    h1 { font: 40px/1.2 Georgia, serif; }
    p { color: var(--text-muted); }
    nav { display: flex; flex-wrap: wrap; gap: 16px 28px; margin-top: 32px; }
    a { color: var(--lavender); text-underline-offset: 5px; }
    a:focus-visible { outline: 2px solid var(--lavender); outline-offset: 6px; }
  </style>
</head>
<body>
  <main data-interface-retired>
    <p>SynthFlow</p>
    <h1>The interface preview has been retired.</h1>
    <p>The previous frontend and its download are no longer available. You can still explore the recorded sound demo.</p>
    <p>SynthFlow is in development. Beta access has not opened yet.</p>
    <nav aria-label="Continue exploring"><a href="/#workbench">Hear recorded examples</a><a href="/preview">Check availability</a></nav>
  </main>
</body>
</html>
